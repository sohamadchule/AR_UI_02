<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Akruti turns your furniture catalog into immersive 3D and AR experiences, so buyers know the fit before they buy." />
    <meta name="theme-color" content="#09090b" />
    <!-- Link previews (WhatsApp, LinkedIn, Slack). Add og:image with an absolute URL once the site has a domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Akruti" />
    <meta property="og:title" content="Akruti — Feel the space. Know the fit." />
    <meta property="og:description" content="3D and AR for furniture brands: buyers place your products in their own room, at true size, before they buy." />
    <meta name="twitter:card" content="summary" />
    <script>
      // Resolve the theme before first paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var t = localStorage.getItem("akruti-theme");
          var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <title>Akruti — Interactive Spatial Commerce</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
